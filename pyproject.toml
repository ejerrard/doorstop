[project]
name = "doorstop"
version = "0.1.0"
description = "Extracts Queensland ministerial diaries (FOI PDFs) into structured, queryable data."
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11",
    "duckdb>=1.5",
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "lxml>=6.1",
    "typer>=0.27",
]

[project.scripts]
doorstop = "doorstop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doorstop"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
